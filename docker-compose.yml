services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gis-agent-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: db
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://host.docker.internal:5432/gis_agent_db
      DB_USER: gis_agent_app
      DB_PASS: ${DB_PASS}
      DB_ENABLED: "true"
      AI_BASE_URL: ${AI_BASE_URL:-https://api.xiaomimimo.com/anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mimo-v2.5-pro}
    ports:
      - "127.0.0.1:22040:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gis-agent-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:21040:80"
    depends_on:
      - backend
