version: "3.8"

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: gis-agent-db
    environment:
      POSTGRES_DB: gis_agent
      POSTGRES_USER: gis_agent
      POSTGRES_PASSWORD: ${DB_PASS:-gis_agent_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gis-agent-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/gis_agent
      DB_USER: gis_agent
      DB_PASS: ${DB_PASS:-gis_agent_dev}
      DB_ENABLED: "true"
      AI_BASE_URL: ${AI_BASE_URL:-https://api.xiaomimimo.com/anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mimo-v2.5-pro}
    ports:
      - "22000:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gis-agent-frontend
    ports:
      - "21000:80"
    depends_on:
      - backend

volumes:
  pgdata:
